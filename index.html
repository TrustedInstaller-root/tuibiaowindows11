<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈昊祺的 Windows 11 桌面</title>
    <style>
        :root {
            --win-accent: #0067c0;
            --win-text: #202020;
            --win-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            height: 100vh; width: 100vw; overflow: hidden;
        }
        /* 登录遮罩层（初始显示） */
        .login-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            color: #fff;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .login-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .login-title {
            font-size: 32px;
            font-weight: 300;
        }
        .login-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(16px);
            padding: 32px;
            border-radius: 12px;
            width: 340px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .login-item {
            margin-bottom: 18px;
        }
        .login-item label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            opacity: 0.9;
        }
        .login-item input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .login-item input:focus {
            border-color: var(--win-accent);
            background: rgba(255,255,255,0.12);
        }
        .login-btn {
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            border: none;
            background: var(--win-accent);
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-btn:hover {
            background: #0055a3;
        }
        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            height: 18px;
            text-align: center;
        }
        /* 登录成功过渡页面 */
        .welcome-screen {
            position: fixed;
            top:0;left:0;
            width:100vw;height:100vh;
            background: #0078d4;
            z-index: 99998;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            gap: 24px;
        }
        .welcome-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* 桌面容器（登录前隐藏） */
        .desktop-container {
            display: none;
            height:100vh; width:100vw;
            background-color: #1a1a2e;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 103, 192, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(150, 100, 220, 0.5) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 150, 200, 0.4) 0%, transparent 60%);
            position: relative;
            overflow: hidden;
        }
        /* 桌面图标 */
        .desktop-icons { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .desktop-icon {
            width: 80px; padding: 8px 0; display: flex; flex-direction: column;
            align-items: center; gap: 6px; border-radius: 6px; cursor: pointer; transition: background 0.1s;
        }
        .desktop-icon:hover { background: rgba(255, 255, 255, 0.1); }
        .icon-img {
            width: 48px; height: 48px; background: rgba(255,255,255,0.9);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .icon-label { color: white; font-size: 12px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        /* 任务栏 */
        .taskbar {
            position: absolute; bottom: 0; width: 100%; height: 48px;
            background: rgba(243, 243, 243, 0.85); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center;
            justify-content: center; z-index: 1000; padding: 0 10px;
        }
        .taskbar-center { display: flex; align-items: center; gap: 4px; }
        
        .tb-btn {
            width: 40px; height: 40px; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
            position: relative; font-size: 20px;
        }
        .tb-btn:hover { background-color: rgba(0,0,0,0.05); }
        .tb-btn.active { background-color: rgba(0,0,0,0.05); }
        .tb-btn.active::after {
            content: ''; position: absolute; bottom: 2px; width: 16px; height: 3px;
            background: var(--win-accent); border-radius: 2px;
        }
        /* 开始菜单 */
        .start-menu {
            position: absolute; bottom: 60px; width: 600px; height: 500px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
            border-radius: 8px; box-shadow: var(--win-shadow); border: 1px solid rgba(0,0,0,0.05);
            padding: 30px; opacity: 0; transform: translateY(20px) scale(0.98);
            pointer-events: none; transition: all 0.2s ease; z-index: 999;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .start-menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        .start-menu h2 { font-size: 16px; margin-bottom: 15px; color: var(--win-text); }
        .start-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .start-app {
            padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 8px;
            border-radius: 6px; cursor: pointer; transition: background 0.1s;
        }
        .start-app:hover { background: rgba(0,0,0,0.05); }
        .start-app-label { font-size: 12px; color: #444; }
        /* 电源按钮区域 */
        .power-area {
            display: flex; justify-content: flex-end; padding-top: 20px; border-top: 1px solid rgba(0,0,0,0.05);
        }
        .power-btn {
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
            color: var(--win-text); transition: background 0.1s;
        }
        .power-btn:hover { background: rgba(0,0,0,0.05); }
        /* 窗口系统 */
        .window {
            position: absolute; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            border-radius: 8px; box-shadow: var(--win-shadow); border: 1px solid rgba(255,255,255,0.8);
            min-width: 350px; display: flex; flex-direction: column; overflow: hidden;
            animation: windowOpen 0.2s ease-out; z-index: 100; transition: all 0.2s ease;
        }
        .window.maximized { top: 0 !important; left: 0 !important; width: 100vw !important; height: calc(100vh - 48px) !important; border-radius: 0; }
        @keyframes windowOpen { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .window-header {
            height: 36px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 10px; background: rgba(255,255,255,0.8); cursor: default;
        }
        .window-title { font-size: 12px; color: #444; margin-left: 8px; pointer-events: none; }
        .window-controls { display: flex; gap: 2px; }
        .win-ctrl-btn {
            width: 46px; height: 32px; border: none; background: transparent; cursor: pointer;
            font-size: 10px; color: #333; display: flex; align-items: center; justify-content: center; border-radius: 4px;
        }
        .win-ctrl-btn:hover { background: rgba(0,0,0,0.05); }
        .win-ctrl-btn.close:hover { background: #c42b1c; color: white; }
        .window-content { padding: 20px; flex: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px; font-size: 14px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        td:first-child { color: #666; width: 80px; font-weight: 500; }
        td:last-child { color: var(--win-text); }
        a { color: var(--win-accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        /* 系统遮罩层 (关机/重启) */
        .system-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0078d4; color: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
        }
        .system-overlay.active { opacity: 1; pointer-events: auto; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div class="login-screen" id="loginScreen">
        <div class="login-title">Windows 11 虚拟桌面登录</div>
        <div class="login-box">
            <div class="login-item">
                <label>用户名</label>
                <input type="text" id="inputUser" placeholder="请输入你的用户名">
            </div>
            <div class="login-item">
                <label>密码</label>
                <!-- 已移除密码框提示文字 placeholder="" -->
                <input type="password" id="inputPwd" placeholder="">
            </div>
            <div class="login-error" id="loginTip"></div>
            <button class="login-btn" onclick="doLogin()">登录系统</button>
        </div>
    </div>

    <!-- 登录成功欢迎过渡页 -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-spinner"></div>
        <div style="font-size:26px;">欢迎，<span id="welcomeUsername"></span></div>
        <div style="font-size:16px;opacity:0.8;">正在准备桌面...</div>
    </div>

    <!-- 桌面主容器 -->
    <div class="desktop-container" id="desktopWrap">
        <!-- 桌面图标 -->
        <div class="desktop-icons">
            <div class="desktop-icon" ondblclick="openWindow('phone')">
                <div class="icon-img">📞</div>
                <div class="icon-label">电话号码</div>
            </div>
            <div class="desktop-icon" ondblclick="openWindow('wechat')">
                <div class="icon-img">💬</div>
                <div class="icon-label">微信</div>
            </div>
            <div class="desktop-icon" ondblclick="openWindow('email')">
                <div class="icon-img">📧</div>
                <div class="icon-label">邮箱</div>
            </div>
        </div>
        <!-- 开始菜单 -->
        <div class="start-menu" id="startMenu">
            <div>
                <h2>已固定</h2>
                <div class="start-grid">
                    <div class="start-app" onclick="openWindow('explorer'); toggleStartMenu();">
                        <div style="font-size:28px;">📁</div>
                        <div class="start-app-label">文件资源管理器</div>
                    </div>
                    <div class="start-app" onclick="openWindow('phone'); toggleStartMenu();">
                        <div style="font-size:28px;">📞</div>
                        <div class="start-app-label">电话号码</div>
                    </div>
                    <div class="start-app" onclick="openWindow('wechat'); toggleStartMenu();">
                        <div style="font-size:28px;">💬</div>
                        <div class="start-app-label">微信</div>
                    </div>
                    <div class="start-app" onclick="openWindow('email'); toggleStartMenu();">
                        <div style="font-size:28px;">📧</div>
                        <div class="start-app-label">邮箱</div>
                    </div>
                    <div class="start-app" onclick="openWindow('help'); toggleStartMenu();">
                        <div style="font-size:28px;">📖</div>
                        <div class="start-app-label">使用说明</div>
                    </div>
                </div>
            </div>
            <div class="power-area">
                <div class="power-btn" onclick="triggerPower('shutdown')">⏻ 关机</div>
                <div class="power-btn" onclick="triggerPower('restart')" style="margin-left:10px;">🔄 重启</div>
            </div>
        </div>
        <!-- 任务栏 -->
        <div class="taskbar">
            <div class="taskbar-center">
                <div class="tb-btn" onclick="toggleStartMenu()" title="开始">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#0067c0"><path d="M3 3h8.5v8.5H3V3zm9.5 0H21v8.5h-8.5V3zM3 12.5h8.5V21H3v-8.5zm9.5 0H21V21h-8.5v-8.5z" /></svg>
                </div>
                <!-- 虚拟桌面按钮 (位于Win徽标和应用图标中间) -->
                <div class="tb-btn" title="虚拟桌面">🗖</div>
                
                <div id="taskbarApps" style="display: flex; gap: 4px;"></div>
            </div>
        </div>
        <!-- 系统遮罩 -->
        <div class="system-overlay" id="systemOverlay">
            <div class="spinner"></div>
            <div id="overlayText" style="font-size: 24px;"></div>
        </div>
    </div>

    <script>
        // ===================== 登录逻辑 =====================
        function doLogin() {
            const user = document.getElementById('inputUser').value.trim();
            const pwd = document.getElementById('inputPwd').value;
            const tip = document.getElementById('loginTip');
            if (!user) {
                tip.innerText = "请输入用户名";
                return;
            }
            if (pwd !== "114514") {
                tip.innerText = "密码错误，请重新输入";
                return;
            }
            // 登录成功
            tip.innerText = "";
            document.getElementById('welcomeUsername').innerText = user;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('welcomeScreen').style.display = "flex";
            // 等待3秒进入桌面
            setTimeout(()=>{
                document.getElementById('welcomeScreen').style.display = "none";
                document.getElementById('desktopWrap').style.display = "block";
                // 自动弹出使用说明窗口
                openWindow('help');
            }, 3000);
        }
        // 回车登录
        document.addEventListener('keydown', e=>{
            if(e.key === 'Enter') doLogin();
        })

        // ===================== 桌面数据模型（新增help使用说明） =====================
        const fileData = {
            phone: { title: "电话号码.txt", label: "电话号码", value: "18011940743", icon: "📞" },
            wechat: { title: "微信账号.txt", label: "微信号", value: "同上 (18011940743)", icon: "💬" },
            email: { title: "电子邮箱.txt", label: "邮箱地址", value: '<a href="mailto:chenhaoqi0927@outlook.com">chenhaoqi0927@outlook.com</a>', icon: "📧" },
            explorer: { title: "文件资源管理器", label: "系统文件", value: "包含所有联系方式文件", icon: "📁", isExplorer: true },
            help: {
                title: "网站使用说明",
                label: "操作指南",
                icon: "📖",
                value: `
                    <h3 style="margin-bottom:12px;">虚拟Windows11桌面使用指南</h3>
                    <p style="margin:8px 0;">1. 双击桌面图标打开对应窗口</p>
                    <p style="margin:8px 0;">2. 点击底部任务栏Windows图标打开开始菜单</p>
                    <p style="margin:8px 0;">3. 窗口顶部拖动标题栏可移动窗口</p>
                    <p style="margin:8px 0;">4. 窗口右上角：最小化 / 最大化 / 关闭</p>
                    <p style="margin:8px 0;">5. 开始菜单底部支持关机、重启页面</p>
                    <p style="margin:8px 0;">6. 文件管理器内可双击快速打开所有文件</p>
                    <p style="margin:12px 0;color:#0067c0;">登录密码固定：114514，用户名可自定义</p>
                `
            }
        };
        let windowCounter = 0;
        let zIndexCounter = 100;
        let activeWindows = {};
        // 拖拽窗口全局变量
        let dragTarget = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        // 2. 开始菜单逻辑
        function toggleStartMenu() {
            document.getElementById('startMenu').classList.toggle('open');
        }
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Meta' || e.key === 'OS') toggleStartMenu();
        });
        document.addEventListener('click', (e) => {
            const startMenu = document.getElementById('startMenu');
            const startBtn = document.querySelector('.taskbar-center > .tb-btn:first-child');
            if (!startMenu.contains(e.target) && !startBtn.contains(e.target)) {
                startMenu.classList.remove('open');
            }
        });
        // 3. 电源管理
        function triggerPower(action) {
            toggleStartMenu();
            const overlay = document.getElementById('systemOverlay');
            const text = document.getElementById('overlayText');
            
            overlay.classList.add('active');
            if (action === 'shutdown') {
                text.innerText = "正在关机...";
                setTimeout(() => {
                    window.close(); 
                    alert("浏览器安全策略阻止了自动关闭标签页。\n请手动关闭此标签页以完成关机。");
                    overlay.classList.remove('active');
                }, 2000);
            } else if (action === 'restart') {
                text.innerText = "正在重启...";
                setTimeout(() => { location.reload(); }, 2000);
            }
        }
        // 4. 窗口核心系统
        function openWindow(type) {
            const data = fileData[type];
            if (!data) return;
            if (activeWindows[type]) {
                focusWindow(activeWindows[type].element);
                if (activeWindows[type].isMinimized) restoreWindow(type);
                return;
            }
            const win = document.createElement('div');
            win.className = 'window';
            win.id = `win-${type}`;
            const offset = (windowCounter % 5) * 30; 
            win.style.top = `${80 + offset}px`;
            win.style.left = `${200 + offset}px`;
            win.style.zIndex = ++zIndexCounter;
            windowCounter++;
            let contentHTML = '';
            if (data.isExplorer) {
                contentHTML = `<h3 style="margin-bottom:15px; font-size:16px;">快速访问</h3>`;
                Object.keys(fileData).forEach(key => {
                    if (key !== 'explorer') {
                        contentHTML += `<div style="padding:10px; border-radius:6px; cursor:pointer; display:flex; align-items:center; gap:10px;" 
                                        onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'"
                                        ondblclick="openWindow('${key}')">
                                            <span style="font-size:20px;">${fileData[key].icon}</span>
                                            <span>${fileData[key].title}</span>
                                        </div>`;
                    }
                });
            } else if(type === 'help'){
                contentHTML = data.value;
            } else {
                contentHTML = `<table><tr><td>名称</td><td>${data.label}</td></tr><tr><td>内容</td><td>${data.value}</td></tr></table>`;
            }
            win.innerHTML = `
                <div class="window-header" onmousedown="startDrag(event, '${type}')">
                    <span class="window-title">${data.title}</span>
                    <div class="window-controls">
                        <button class="win-ctrl-btn" onclick="minimizeWindow('${type}')" title="最小化">─</button>
                        <button class="win-ctrl-btn" onclick="toggleMaximize('${type}')" title="最大化">☐</button>
                        <button class="win-ctrl-btn close" onclick="closeWindow('${type}')" title="关闭">✕</button>
                    </div>
                </div>
                <div class="window-content">${contentHTML}</div>
            `;
            win.addEventListener('mousedown', () => focusWindow(win));
            document.getElementById('desktopWrap').appendChild(win);
            activeWindows[type] = { element: win, isMinimized: false, isMaximized: false };
            updateTaskbar(type, true);
            focusWindow(win);
        }
        // 窗口拖拽逻辑
        function startDrag(e, type) {
            if (activeWindows[type].isMaximized) return;
            dragTarget = activeWindows[type].element;
            const rect = dragTarget.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('mouseup', dragEnd);
        }
        function dragMove(e) {
            if (!dragTarget) return;
            dragTarget.style.left = `${e.clientX - dragOffsetX}px`;
            dragTarget.style.top = `${e.clientY - dragOffsetY}px`;
        }
        function dragEnd() {
            dragTarget = null;
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('mouseup', dragEnd);
        }
        // 5. 窗口控制函数
        function focusWindow(winEl) {
            document.querySelectorAll('.window').forEach(w => w.style.zIndex = 100);
            winEl.style.zIndex = ++zIndexCounter;
        }
        function minimizeWindow(type) {
            const winState = activeWindows[type];
            if (!winState) return;
            winState.element.style.display = 'none';
            winState.isMinimized = true;
            updateTaskbar(type, true, false);
        }
        function restoreWindow(type) {
            const winState = activeWindows[type];
            if (!winState) return;
            winState.element.style.display = 'flex';
            winState.isMinimized = false;
            focusWindow(winState.element);
            updateTaskbar(type, true, true);
        }
        function toggleMaximize(type) {
            const winState = activeWindows[type];
            if (!winState) return;
            winState.isMaximized = !winState.isMaximized;
            winState.element.classList.toggle('maximized');
        }
        function closeWindow(type) {
            const winState = activeWindows[type];
            if (!winState) return;
            winState.element.remove();
            delete activeWindows[type];
            updateTaskbar(type, false);
        }
        // 6. 任务栏联动
        function updateTaskbar(type, show, isActive = true) {
            const container = document.getElementById('taskbarApps');
            let btn = document.getElementById(`tb-btn-${type}`);
            const appInfo = fileData[type];
            if (show) {
                if (!btn) {
                    btn = document.createElement('div');
                    btn.className = 'tb-btn';
                    btn.id = `tb-btn-${type}`;
                    btn.innerHTML = appInfo.icon;
                    btn.title = appInfo.title;
                    btn.onclick = function () {
                        if (activeWindows[type].isMinimized) {
                            restoreWindow(type);
                        } else {
                            minimizeWindow(type);
                        }
                    };
                    container.appendChild(btn);
                }
                if (isActive) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            } else {
                if (btn) btn.remove();
            }
        }
    </script>
</body>
</html>
