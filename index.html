<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome to get updates - Windows 11</title>
    <style>
        :root {
            --win-accent: #0067c0;
            --win-text: #202020;
            --win-text-dark: #f1f1f1;
            --win-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
            --bg-light: rgba(255,255,255,0.9);
            --bg-dark: rgba(20,20,30,0.9);
            --bg-taskbar-light: rgba(243, 243, 243, 0.85);
            --bg-taskbar-dark: rgba(18,18,26,0.85);
            /* 桌面网格常量 */
            --grid-cell-w: 95px;
            --grid-cell-h: 95px;
            --grid-padding: 20px;
            --menu-ease: cubic-bezier(0.2,0,0.2,1);
        }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            height: 100vh; width: 100vw; overflow: hidden;
            transition: background 0.4s;
        }
        body.dark-mode {
            --win-text: #f1f1f1;
            --bg-light: rgba(30,30,40,0.9);
        }
        /* 登录遮罩层（初始显示） */
        .login-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            color: #fff;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .login-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .login-title {
            font-size: 32px;
            font-weight: 300;
        }
        .login-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(16px);
            padding: 32px;
            border-radius: 12px;
            width: 340px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .login-item {
            margin-bottom: 18px;
        }
        .login-item label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            opacity: 0.9;
        }
        .login-item input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .login-item input:focus {
            border-color: var(--win-accent);
            background: rgba(255,255,255,0.12);
        }
        .login-btn {
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            border: none;
            background: var(--win-accent);
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-btn:hover {
            background: #0055a3;
        }
        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            height: 18px;
            text-align: center;
        }
        /* 登录成功过渡页面 */
        .welcome-screen {
            position: fixed;
            top:0;left:0;
            width:100vw;height:100vh;
            background: #0078d4;
            z-index: 99998;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            gap: 24px;
        }
        .welcome-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* 桌面主容器（登录前隐藏） */
        .desktop-container {
            display: none;
            height:100vh; width:100vw;
            background-color: #1a1a2e;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 103, 192, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(150, 100, 220, 0.5) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 150, 200, 0.4) 0%, transparent 60%);
            position: relative;
            overflow: hidden;
        }
        /* 桌面图标容器 - 靠左布局 */
        .desktop-icons { 
            position: absolute;
            top: var(--grid-padding);
            left: var(--grid-padding);
            width: calc(100% - var(--grid-padding) * 2);
            height: calc(100% - 48px - var(--grid-padding) * 2);
        }
        /* 桌面图标基础样式 */
        .desktop-icon {
            width: var(--grid-cell-w);
            height: var(--grid-cell-h);
            padding: 8px 0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            gap: 6px; 
            border-radius: 6px; 
            cursor: grab; 
            transition: background 0.1s, opacity 0.2s;
            position: absolute;
        }
        .desktop-icon:active {
            cursor: grabbing;
        }
        .desktop-icon.dragging {
            opacity: 0.6;
            z-index: 9999;
        }
        .desktop-icon:hover { background: rgba(255, 255, 255, 0.1); }
        .icon-img {
            width: 48px; height: 48px; background: rgba(255,255,255,0.9);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .icon-label { color: white; font-size: 12px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        /* 任务栏 - 图标完全居中 */
        .taskbar {
            position: absolute; bottom: 0; width: 100%; height: 48px;
            background: var(--bg-taskbar-light); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05); 
            z-index: 1000;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            padding: 0 10px;
        }
        body.dark-mode .taskbar { background: var(--bg-taskbar-dark); }
        /* 中间居中区域 */
        .taskbar-center { 
            display: flex; 
            align-items: center; 
            gap: 4px;
            grid-column: 2;
        }
        /* 右侧托盘时钟区域 */
        .taskbar-tray { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            padding-right:10px; 
            color: var(--win-text); 
            font-size:13px;
            grid-column: 3;
            justify-self: end;
        }
        .tb-btn {
            width: 40px; height: 40px; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
            position: relative; font-size: 20px;
        }
        .tb-btn:hover { background-color: rgba(0,0,0,0.05); }
        body.dark-mode .tb-btn:hover { background: rgba(255,255,255,0.1); }
        .tb-btn.active { background-color: rgba(0,0,0,0.05); }
        body.dark-mode .tb-btn.active { background: rgba(255,255,255,0.1); }
        .tb-btn.active::after {
            content: ''; position: absolute; bottom: 2px; width: 16px; height: 3px;
            background: var(--win-accent); border-radius: 2px;
        }
        /* ========== 修复：开始菜单居中+丝滑滑出动效 ========== */
        .start-menu {
            position: absolute; 
            bottom: 60px; 
            left: 50%;
            transform: translateX(-50%) translateY(20px) scale(0.96);
            width: 600px; height: 520px;
            background: var(--bg-light); backdrop-filter: blur(20px);
            border-radius: 8px; box-shadow: var(--win-shadow); border: 1px solid rgba(0,0,0,0.05);
            padding: 30px; 
            opacity: 0; 
            pointer-events: none; 
            transition: all 0.26s var(--menu-ease); 
            z-index: 999;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .start-menu.open { 
            opacity: 1; 
            transform: translateX(-50%) translateY(0) scale(1); 
            pointer-events: auto; 
        }
        .start-search {
            width:100%; padding:10px 14px; border-radius:6px; border:none;
            background:rgba(0,0,0,0.06); margin-bottom:20px; font-size:14px; color:var(--win-text);
            outline:none;
        }
        body.dark-mode .start-search { background:rgba(255,255,255,0.1); color:#fff; }
        .start-menu h2 { font-size: 16px; margin-bottom: 15px; color: var(--win-text); }
        .start-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .start-app {
            padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 8px;
            border-radius: 6px; cursor: pointer; transition: background 0.1s;
        }
        .start-app:hover { background: rgba(0,0,0,0.05); }
        body.dark-mode .start-app:hover { background:rgba(255,255,255,0.08); }
        .start-app-label { font-size: 12px; color: var(--win-text); }
        /* 电源按钮区域 */
        .power-area {
            display: flex; justify-content: flex-end; padding-top: 20px; border-top: 1px solid rgba(0,0,0,0.05);
        }
        .power-btn {
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
            color: var(--win-text); transition: background 0.1s;
        }
        .power-btn:hover { background: rgba(0,0,0,0.05); }
        body.dark-mode .power-btn:hover { background:rgba(255,255,255,0.08); }
        /* 窗口系统 */
        .window {
            position: absolute; background: var(--bg-light); backdrop-filter: blur(20px);
            border-radius: 8px; box-shadow: var(--win-shadow); border: 1px solid rgba(255,255,255,0.8);
            min-width: 350px; min-height:220px; display: flex; flex-direction: column; overflow: hidden;
            animation: windowOpen 0.2s ease-out; z-index: 100; transition: all 0.2s ease;
            resize: both; overflow:auto;
        }
        .window.maximized { top: 0 !important; left: 0 !important; width: 100vw !important; height: calc(100vh - 48px) !important; border-radius: 0; resize:none; }
        @keyframes windowOpen { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .window-header {
            height: 36px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 10px; background: rgba(255,255,255,0.8); cursor: default;
        }
        body.dark-mode .window-header { background:rgba(40,40,50,0.9); }
        .window-title { font-size: 12px; color: var(--win-text); margin-left: 8px; pointer-events: none; }
        .window-controls { display: flex; gap: 2px; }
        .win-ctrl-btn {
            width: 46px; height: 32px; border: none; background: transparent; cursor: pointer;
            font-size: 10px; color: var(--win-text); display: flex; align-items: center; justify-content: center; border-radius: 4px;
        }
        .win-ctrl-btn:hover { background: rgba(0,0,0,0.05); }
        body.dark-mode .win-ctrl-btn:hover { background:rgba(255,255,255,0.08); }
        .win-ctrl-btn.close:hover { background: #c42b1c; color: white; }
        .window-content { padding: 0; flex: 1; overflow-y: auto; color:var(--win-text); display:flex; flex-direction:column; }
        /* 文件资源管理器专用样式 */
        .explorer-top-bar {
            display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid rgba(0,0,0,0.08);
        }
        .explorer-nav-btn {
            width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:4px; cursor:pointer; font-size:16px;
        }
        .explorer-nav-btn:hover { background:rgba(0,0,0,0.06); }
        body.dark-mode .explorer-nav-btn:hover { background:rgba(255,255,255,0.08); }
        .explorer-path {
            flex:1; padding:6px 10px; border-radius:4px; background:rgba(0,0,0,0.04); font-size:13px;
        }
        body.dark-mode .explorer-path { background:rgba(255,255,255,0.08); }
        .explorer-wrap { display:flex; flex:1; overflow:hidden; }
        .explorer-sidebar { width:180px; border-right:1px solid rgba(0,0,0,0.08); padding:10px; overflow-y:auto; }
        .explorer-sidebar-item { padding:6px 8px; border-radius:4px; cursor:pointer; display:flex; gap:8px; align-items:center; font-size:13px; margin-bottom:4px; }
        .explorer-sidebar-item:hover { background:rgba(0,0,0,0.06); }
        body.dark-mode .explorer-sidebar-item:hover { background:rgba(255,255,255,0.08); }
        .explorer-list { flex:1; padding:10px; overflow-y:auto; }
        .explorer-file-row { display:flex; align-items:center; padding:8px 10px; border-radius:4px; gap:10px; cursor:pointer; }
        .explorer-file-row:hover { background:rgba(0,0,0,0.06); }
        body.dark-mode .explorer-file-row:hover { background:rgba(255,255,255,0.08); }
        .explorer-file-name { flex:1; font-size:13px; }
        .explorer-file-type { width:80px; font-size:12px; opacity:0.7; text-align:center; }
        .explorer-file-size { width:70px; font-size:12px; opacity:0.7; text-align:right; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px; font-size: 14px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        td:first-child { color: #666; width: 80px; font-weight: 500; }
        body.dark-mode td:first-child { color:#aaa; }
        td:last-child { color: var(--win-text); }
        a { color: var(--win-accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        /* 系统遮罩层 (关机/重启) */
        .system-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0078d4; color: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
        }
        .system-overlay.active { opacity: 1; pointer-events: auto; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        /* 桌面右键菜单 + 新建子菜单 */
        .context-menu {
            position:fixed; width:220px; background:var(--bg-light); backdrop-filter:blur(20px);
            border-radius:6px; box-shadow:var(--win-shadow); z-index:9999; padding:6px;
            opacity:0; pointer-events:none; transition:opacity 0.15s;
        }
        .context-menu.show { opacity:1; pointer-events:auto; }
        .ctx-item {
            padding:8px 12px; border-radius:4px; cursor:pointer; font-size:14px; color:var(--win-text);
            display:flex;justify-content:space-between;align-items:center;
        }
        .ctx-item:hover { background:rgba(0,0,0,0.06); }
        body.dark-mode .ctx-item:hover { background:rgba(255,255,255,0.08); }
        .ctx-divider { height:1px; background:rgba(0,0,0,0.1); margin:4px 0; }
        body.dark-mode .ctx-divider { background:rgba(255,255,255,0.1); }
        /* 新建子菜单 */
        .ctx-sub {
            position:absolute; left:100%; top:0; width:180px;
            background:var(--bg-light); backdrop-filter:blur(20px); border-radius:6px;
            box-shadow:var(--win-shadow); padding:6px; display:none;
        }
        .ctx-parent:hover .ctx-sub { display:block; }
        /* 壁纸选择卡片 */
        .wallpaper-option {
            width:120px; height:70px; border-radius:6px; cursor:pointer; border:2px solid transparent;
        }
        .wallpaper-option.active { border-color:var(--win-accent); }
        /* 计算器样式 */
        .calc-wrap { display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin-top:10px; }
        .calc-input { grid-column:1/-1; padding:10px; font-size:22px; text-align:right; border:none; border-radius:6px; background:rgba(0,0,0,0.06); color:var(--win-text); }
        body.dark-mode .calc-input { background:rgba(255,255,255,0.1); }
        .calc-btn { padding:14px; border:none; border-radius:6px; font-size:16px; cursor:pointer; background:rgba(0,0,0,0.05); color:var(--win-text); }
        body.dark-mode .calc-btn { background:rgba(255,255,255,0.08); }
        .calc-btn.opt { background:var(--win-accent); color:#fff; }
        /* 记事本 */
        .notepad-textarea { width:100%; height:100%; min-height:260px; border:none; outline:none; background:transparent; color:var(--win-text); font-size:14px; resize:none; padding:10px; }
    </style>
</head>
<body>
    <!-- 右键菜单（新增新建子菜单） -->
    <div class="context-menu" id="ctxMenu">
        <div class="ctx-item ctx-parent">
            新建
            <div class="ctx-sub">
                <div class="ctx-item" onclick="newTextFile();hideCtx()">文本文档</div>
                <div class="ctx-item" onclick="newFolder();hideCtx()">文件夹</div>
            </div>
        </div>
        <div class="ctx-item" onclick="openWindow('settings'); hideCtx()">个性化设置</div>
        <div class="ctx-item" id="autoArrangeToggle" onclick="toggleAutoArrange(); hideCtx()">自动排列图标：开启</div>
        <div class="ctx-divider"></div>
        <div class="ctx-item" onclick="arrangeIconsGrid(); hideCtx()">对齐网格规整图标</div>
        <div class="ctx-item" onclick="refreshDesktop(); hideCtx()">flip</div>
        <div class="ctx-divider"></div>
        <div class="ctx-item" onclick="openWindow('explorer'); hideCtx()">explorer</div>
        <div class="ctx-item" onclick="openWindow('calc'); hideCtx()">计算器</div>
        <div class="ctx-item" onclick="openWindow('notepad'); hideCtx()">记事本</div>
    </div>
    <!-- 登录界面 -->
    <div class="login-screen" id="loginScreen">
        <div class="login-title">Windows 11 虚拟桌面登录</div>
        <div class="login-box">
            <div class="login-item">
                <label>user name</label>
                <input type="text" id="inputUser" placeholder="enter your name...">
            </div>
            <div class="login-item">
                <label>password</label>
                <input type="password" id="inputPwd" placeholder="">
            </div>
            <div class="login-error" id="loginTip"></div>
            <button class="login-btn" onclick="doLogin()">setup</button>
        </div>
    </div>
    <!-- 登录成功过渡页 -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-spinner"></div>
        <div style="font-size:26px;">欢迎，<span id="welcomeUsername"></span></div>
        <div style="font-size:16px;opacity:0.8;">正在准备桌面...</div>
    </div>
    <!-- 桌面主容器 -->
    <div class="desktop-container" id="desktopWrap">
        <!-- 桌面图标容器 -->
        <div class="desktop-icons" id="iconContainer">
            <div class="desktop-icon" data-id="explorer" ondblclick="openWindow('explorer')">
                <div class="icon-img">📁</div>
                <div class="icon-label">explorer</div>
            </div>
            <div class="desktop-icon" data-id="phone" ondblclick="openWindow('phone')">
                <div class="icon-img">📞</div>
                <div class="icon-label">phone</div>
            </div>
            <div class="desktop-icon" data-id="wechat" ondblclick="openWindow('wechat')">
                <div class="icon-img">💬</div>
                <div class="icon-label">WeChat</div>
            </div>
            <div class="desktop-icon" data-id="email" ondblclick="openWindow('email')">
                <div class="icon-img">📧</div>
                <div class="icon-label">e-mail</div>
            </div>
            <div class="desktop-icon" data-id="calc" ondblclick="openWindow('calc')">
                <div class="icon-img">🔢</div>
                <div class="icon-label">计算器</div>
            </div>
            <div class="desktop-icon" data-id="notepad" ondblclick="openWindow('notepad')">
                <div class="icon-img">📝</div>
                <div class="icon-label">记事本</div>
            </div>
            <div class="desktop-icon" data-id="recycle" id="recycleBin" ondblclick="openWindow('recycle')">
                <div class="icon-img">🗑️</div>
                <div class="icon-label">回收站</div>
            </div>
        </div>
        <!-- 开始菜单 -->
        <div class="start-menu" id="startMenu">
            <input class="start-search" placeholder="search..." oninput="filterApps(this.value)">
            <div>
                <h2>已固定</h2>
                <div class="start-grid" id="appGrid">
                    <div class="start-app" data-key="explorer" onclick="openWindow('explorer'); toggleStartMenu();">
                        <div style="font-size:28px;">📁</div>
                        <div class="start-app-label">explorer.exe</div>
                    </div>
                    <div class="start-app" data-key="phone" onclick="openWindow('phone'); toggleStartMenu();">
                        <div style="font-size:28px;">📞</div>
                        <div class="start-app-label">phone</div>
                    </div>
                    <div class="start-app" data-key="wechat" onclick="openWindow('wechat'); toggleStartMenu();">
                        <div style="font-size:28px;">💬</div>
                        <div class="start-app-label">WeChat</div>
                    </div>
                    <div class="start-app" data-key="email" onclick="openWindow('email'); toggleStartMenu();">
                        <div style="font-size:28px;">📧</div>
                        <div class="start-app-label">e-mail</div>
                    </div>
                    <div class="start-app" data-key="calc" onclick="openWindow('calc'); toggleStartMenu();">
                        <div style="font-size:28px;">🔢</div>
                        <div class="start-app-label">计算器</div>
                    </div>
                    <div class="start-app" data-key="notepad" onclick="openWindow('notepad'); toggleStartMenu();">
                        <div style="font-size:28px;">📝</div>
                        <div class="start-app-label">记事本</div>
                    </div>
                    <div class="start-app" data-key="settings" onclick="openWindow('settings'); toggleStartMenu();">
                        <div style="font-size:28px;">⚙️</div>
                        <div class="start-app-label">set</div>
                    </div>
                    <div class="start-app" data-key="help" onclick="openWindow('help'); toggleStartMenu();">
                        <div style="font-size:28px;">📖</div>
                        <div class="start-app-label">使用说明</div>
                    </div>
                </div>
            </div>
            <div class="power-area">
                <div class="power-btn" onclick="triggerPower('shutdown')">⏻ 关机</div>
                <div class="power-btn" onclick="triggerPower('restart')" style="margin-left:10px;">🔄 重启</div>
            </div>
        </div>
        <!-- 任务栏 -->
        <div class="taskbar">
            <div class="taskbar-center">

        // 【BUG1修复】矩形碰撞检测 判断两个图标是否重叠
        function isRectOverlap(rectA, rectB) {
            return !(
                rectA.right <= rectB.left ||
                rectA.left >= rectB.right ||
                rectA.bottom <= rectB.top ||
                rectA.top >= rectB.bottom
            );
        }
        // 拖拽结束处理（增加碰撞避让逻辑）
        function endIconDrag(){
            if(!dragIcon) return;
            // 拖拽结束吸附网格
            const rawLeft = parseInt(dragIcon.style.left);
            const rawTop = parseInt(dragIcon.style.top);
            let snapL = snapGrid(rawLeft);
            let snapT = snapGrid(rawTop);
            // 获取当前拖拽图标矩形
            const dragRect = {
                left: snapL,
                top: snapT,
                right: snapL + GRID_CELL,
                bottom: snapT + GRID_CELL
            };
            // 获取所有其他图标，检测碰撞
            const allIcons = document.querySelectorAll('.desktop-icon');
            let hasCollision = true;
            while(hasCollision){
                hasCollision = false;
                for(let icon of allIcons){
                    if(icon === dragIcon) continue;
                    const l = parseInt(icon.style.left);
                    const t = parseInt(icon.style.top);
                    const iconRect = {
                        left: l,
                        top: t,
                        right: l + GRID_CELL,
                        bottom: t + GRID_CELL
                    };
                    if(isRectOverlap(dragRect, iconRect)){
                        // 重叠则向下移动一格网格
                        snapT += GRID_CELL;
                        dragRect.top = snapT;
                        dragRect.bottom = snapT + GRID_CELL;
                        hasCollision = true;
                        break;
                    }
                }
            }
            dragIcon.style.left = snapL + 'px';
            dragIcon.style.top = snapT + 'px';
            // 保存位置
            const id = dragIcon.dataset.id;
            iconPositions[id] = {left:snapL, top:snapT};
            storage.set('desktopIconPos', iconPositions);
            dragIcon.classList.remove('dragging');
            dragIcon = null;

        function calcEqual(){
            const curr = Number(document.getElementById('calcInput').value);
            const prev = Number(calcPrev);
            let res;
            switch(calcOp){
                case '+': res = prev + curr; break;
                case '-': res = prev - curr; break;
                case '*': res = prev * curr; break;
                case '/': res = prev / curr; break;
                default: return;
            }
            document.getElementById('calcInput').value = res;
            calcOp = ''; calcPrev = '';

                            <div class="explorer-sidebar-item">💿 D盘</div>
                        </div>
                        <div class="explorer-list">
                            <div class="explorer-file-row" style="font-weight:bold;opacity:0.8;border-bottom:1px solid rgba(0,0,0,0.08);padding-bottom:6px;">
                                <span style="width:24px;"></span>
                                <div class="explorer-file-name">名称</div>
                                <div class="explorer-file-type">类型</div>
                                <div class="explorer-file-size">大小</div>
                            </div>
                            ${fileListHtml}
                        </div>
                    </div>
                `;
            } else {
                contentHTML = `<div style="padding:20px;flex:1;overflow-y:auto;">${data.value}</div>`;
            }
            win.innerHTML = `
                <div class="window-header" onmousedown="startDrag(event, '${type}')">
                    <span class="window-title">${data.title}</span>
                    <div class="window-controls">
                        <button class="win-ctrl-btn" onclick="minimizeWindow('${type}')" title="最小化">─</button>
                        <button class="win-ctrl-btn" onclick="toggleMaximize('${type}')" title="最大化">☐</button>
                        <button class="win-ctrl-btn close" onclick="closeWindow('${type}')" title="关闭">✕</button>
                    </div>
                </div>
                <div class="window-content">${contentHTML}</div>
            `;
            win.addEventListener('mousedown', () => focusWindow(win));
            document.getElementById('desktopWrap').appendChild(win);
            activeWindows[type] = { element: win, isMinimized: false, isMaximized: false };
            updateTaskbar(type, true);
            focusWindow(win);
        }
        // 窗口拖拽
        function startDrag(e, type) {
            if (activeWindows[type].isMaximized) return;
            dragTarget = activeWindows[type].element;
            const rect = dragTarget.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('mouseup', dragEnd);
        }
        function dragMove(e) {
            if (!dragTarget) return;
            dragTarget.style.left = `${e.clientX - dragOffsetX}px`;
            dragTarget.style.top = `${e.clientY - dragOffsetY}px`;
        }
        function dragEnd() {
            dragTarget = null;
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('mouseup', dragEnd);
        }
        // 窗口控制
        function focusWindow(winEl) {
            document.querySelectorAll('.window').forEach(w => w.style.zIndex = 100);
            winEl.style.zIndex = ++zIndexCounter;
        }
        function minimizeWindow(type) {
            const winState = activeWindows[type];
            if (!winState) return;
            winState.element.style.display = 'none';
            winState.isMinimized = true;
            updateTaskbar(type, true, false);
        }
        function restoreWindow(type) {
            const winState = activeWindows[type];
            if (!winState) return;
            winState.element.style.display = 'flex';
            winState.isMinimized = false;
            focusWindow(winState.element);
            updateTaskbar(type, true, true);
        }
        function toggleMaximize(type) {
            const winState = activeWindows[type];
            if (!winState) return;
            winState.isMaximized = !winState.isMaximized;
            winState.element.classList.toggle('maximized');
        }
        function closeWindow(type) {
            const winState = activeWindows[type];
            if (!winState) return;
            winState.element.remove();
            delete activeWindows[type];
            updateTaskbar(type, false);
        }
        // 任务栏图标更新
        function updateTaskbar(type, show, isActive = true) {
            const container = document.getElementById('taskbarApps');
            let btn = document.getElementById(`tb-btn-${type}`);
            const appInfo = fileData[type];
            if (show) {
                if (!btn) {
                    btn = document.createElement('div');
                    btn.className = 'tb-btn';
                    btn.id = `tb-btn-${type}`;
                    btn.innerHTML = appInfo.icon;
                    btn.title = appInfo.title;
                    btn.onclick = function () {
                        if (activeWindows[type].isMinimized) restoreWindow(type);
                        else minimizeWindow(type);
                    };
                    container.appendChild(btn);
                }
                btn.classList.toggle('active', isActive);
            } else {
                if (btn) btn.remove();
            }
        }
    </script>
</body>
</html>
